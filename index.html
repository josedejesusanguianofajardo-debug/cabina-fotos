<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FLASHBOOTH — Cabina de fotos</title>
<meta name="description" content="Cabina de fotos con cámara web, filtros, cuenta regresiva y galería." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='14' width='64' height='64' fill='%2312081a'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23ff2d95' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%2322f0ff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #12081a;
  --bg2: #1d0e2c;
  --ink: #fff6e8;
  --muted: #c9b6d8;
  --pink: #ff2d95;
  --cyan: #22f0ff;
  --gold: #ffd166;
  --cream: #fff6e8;
  --danger: #ff4d6d;
  --ok: #3dff9a;
  --film: #161016;
  --radius: 28px;
  --shadow: 0 24px 60px rgba(0,0,0,.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: Outfit, system-ui, sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(255,45,149,.28), transparent 55%),
    radial-gradient(900px 500px at 110% 10%, rgba(34,240,255,.18), transparent 50%),
    radial-gradient(700px 400px at 50% 120%, rgba(255,209,102,.12), transparent 50%),
    var(--bg);
  color: var(--ink);
  min-height: 100%;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; opacity: .07;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='n'><feTurbulence baseFrequency='.8' numOctaves='2'/></filter><rect width='80' height='80' filter='url(%23n)'/></svg>");
}
.app {
  max-width: 1120px;
  margin: 0 auto;
  padding: 18px 16px 28px;
  display: grid;
  gap: 16px;
}
header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.logo {
  font-family: Bungee, sans-serif;
  font-size: clamp(22px, 4vw, 34px);
  letter-spacing: 1px;
  line-height: 1;
  text-shadow: 0 0 18px rgba(255,45,149,.6);
}
.logo span { color: var(--cyan); text-shadow: 0 0 18px rgba(34,240,255,.55); }
.status {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  padding: 8px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  backdrop-filter: blur(10px);
}
.status i {
  width: 9px; height: 9px; border-radius: 50%; background: #6b5a78; display: inline-block;
}
.status.live i { background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: pulse 1.4s infinite; }
.status.wait i { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.status.bad i { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
@keyframes pulse { 50% { opacity: .35 } }
.layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
@media (min-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1.15fr) 280px; align-items: start; }
}
.stage {
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
  border: 1px solid rgba(255,255,255,.1);
  border-radius: calc(var(--radius) + 8px);
  padding: 14px;
  box-shadow: var(--shadow);
}
.viewfinder {
  position: relative;
  aspect-ratio: 3 / 4;
  max-height: min(68vh, 720px);
  margin: 0 auto;
  border-radius: var(--radius);
  overflow: hidden;
  background: #07040b;
  box-shadow:
    0 0 0 3px rgba(255,45,149,.45),
    0 0 0 8px rgba(34,240,255,.18),
    inset 0 0 80px rgba(255,45,149,.08);
}
video, .snap-preview {
  width: 100%; height: 100%; object-fit: cover; display: block; background: #07040b;
}
video.mirror { transform: scaleX(-1); }
.chrome {
  position: absolute; inset: 12px; pointer-events: none;
}
.bracket {
  position: absolute; width: 28px; height: 28px; border: 3px solid rgba(255,246,232,.85);
}
.bracket.tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
.bracket.tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 6px 0 0; }
.bracket.bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 6px; }
.bracket.br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }
.live-pill {
  position: absolute; top: 14px; left: 14px;
  display: none; align-items: center; gap: 6px;
  background: rgba(0,0,0,.45); color: var(--cream);
  font-size: 11px; font-weight: 800; letter-spacing: 1.4px;
  padding: 6px 10px; border-radius: 999px;
}
.live-pill.on { display: inline-flex; }
.live-pill b { width: 7px; height: 7px; border-radius: 50%; background: #ff3b3b; animation: pulse 1s infinite; }
.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding: 22px;
  text-align: center;
  background: linear-gradient(180deg, rgba(18,8,26,.35), rgba(18,8,26,.72));
}
.overlay.hidden { display: none; }
.card {
  width: min(100%, 360px);
  background: rgba(18,8,26,.78);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 24px;
  padding: 22px 18px 18px;
  backdrop-filter: blur(16px);
}
.card h2 {
  font-family: Bungee, sans-serif;
  font-size: 22px; margin-bottom: 8px;
}
.card p { color: var(--muted); font-size: 14px; line-height: 1.45; margin-bottom: 16px; }
.btn {
  appearance: none; border: 0; cursor: pointer;
  font-family: Outfit, sans-serif; font-weight: 800;
  border-radius: 999px; padding: 12px 18px;
  background: linear-gradient(180deg, #ff5eb0, var(--pink));
  color: white; box-shadow: 0 10px 24px rgba(255,45,149,.35);
  transition: transform .15s ease, filter .15s ease;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.ghost {
  background: rgba(255,255,255,.08); color: var(--cream);
  box-shadow: none; border: 1px solid rgba(255,255,255,.12);
}
.btn.cyan {
  background: linear-gradient(180deg, #7af7ff, var(--cyan));
  color: #081318; box-shadow: 0 10px 24px rgba(34,240,255,.28);
}
.spin {
  width: 46px; height: 46px; margin: 0 auto 12px;
  border: 4px solid rgba(255,255,255,.15);
  border-top-color: var(--cyan);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }
.count {
  position: absolute; inset: 0; display: none; place-items: center;
  background: rgba(8,4,12,.28); z-index: 3;
}
.count.show { display: grid; }
.count b {
  font-family: Bungee, sans-serif;
  font-size: clamp(90px, 22vw, 180px);
  color: white;
  text-shadow: 0 0 30px var(--pink), 0 8px 0 rgba(0,0,0,.25);
  animation: pop .35s ease;
}
@keyframes pop { from { transform: scale(.4); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.flash {
  position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 4;
}
.flash.go { animation: flash .35s ease; }
@keyframes flash { 0% { opacity: .95 } 100% { opacity: 0 } }
.controls {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 14px 6px 4px;
}
.icon-btn {
  width: 48px; height: 48px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.07); color: var(--cream);
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.icon-btn.hidden { display: none; }
.shutter {
  width: 86px; height: 86px; border-radius: 50%;
  border: 6px solid white; background: radial-gradient(circle at 50% 40%, #ff7ac2, var(--pink) 58%, #c0126a);
  box-shadow: 0 0 0 6px rgba(255,45,149,.25), 0 16px 30px rgba(255,45,149,.35);
  cursor: pointer; position: relative;
}
.shutter::after {
  content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.45);
}
.shutter:disabled { opacity: .4; cursor: not-allowed; }
.toolbar {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 4px 4px 8px;
}
.chip {
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06);
  color: var(--cream); border-radius: 999px;
  padding: 8px 12px; font-weight: 700; font-size: 13px; cursor: pointer;
}
.chip.active { background: var(--gold); color: #2a1600; border-color: transparent; }
.side {
  display: grid; gap: 12px;
}
.panel {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 22px; padding: 14px;
}
.panel h3 {
  font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px; font-weight: 800;
}
.filters {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.filter {
  border: 1px solid rgba(255,255,255,.1);
  background: #2a1638; color: white; border-radius: 14px;
  padding: 10px 6px 8px; cursor: pointer; min-height: 74px;
  display: grid; gap: 6px; place-items: center;
}
.filter span {
  width: 100%; height: 36px; border-radius: 8px; display: block;
  background:
    linear-gradient(45deg, #ffb3d9, #86f3ff 50%, #ffd166);
}
.filter em { font-style: normal; font-size: 11px; font-weight: 700; }
.filter.active { outline: 2px solid var(--cyan); box-shadow: 0 0 16px rgba(34,240,255,.25); }
.gallery-wrap {
  background: var(--film);
  border-radius: 22px;
  padding: 12px 12px 10px;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: var(--shadow);
}
.gallery-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
}
.film {
  display: flex; gap: 10px; overflow-x: auto; padding: 10px 4px 8px;
  scrollbar-width: thin;
}
.sprockets {
  height: 10px;
  background: repeating-linear-gradient(90deg, #0b090c 0 10px, transparent 10px 22px);
  opacity: .9; border-radius: 2px;
}
.empty {
  color: #8a748f; font-size: 13px; padding: 18px 8px; text-align: center; width: 100%;
}
.shot {
  flex: 0 0 108px; background: #fff6e8; color: #1b1220;
  border-radius: 6px 6px 14px 14px; padding: 6px 6px 18px;
  box-shadow: 0 8px 16px rgba(0,0,0,.35); cursor: pointer; position: relative;
}
.shot img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; border-radius: 3px; }
.shot small { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 9px; font-weight: 800; letter-spacing: .4px; }
.lightbox {
  position: fixed; inset: 0; background: rgba(6,2,10,.82);
  display: none; place-items: center; padding: 18px; z-index: 20;
}
.lightbox.on { display: grid; }
.lightbox img {
  max-width: min(92vw, 520px); max-height: 70vh; border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.lightbox .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.hint { text-align: center; color: var(--muted); font-size: 12px; }
kbd {
  font-family: Outfit, sans-serif; font-size: 11px; padding: 2px 6px;
  border: 1px solid rgba(255,255,255,.18); border-radius: 6px; background: rgba(255,255,255,.06);
}
@media (max-width: 720px) {
  .filters { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .viewfinder { max-height: 58vh; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">FLASH<span>BOOTH</span></div>
    <div class="status wait" id="status"><i></i><span>Cámara apagada</span></div>
  </header>

  <div class="layout">
    <section class="stage">
      <div class="viewfinder" id="finder">
        <video id="video" playsinline autoplay muted></video>
        <img id="preview" class="snap-preview" alt="" hidden />
        <div class="chrome">
          <div class="bracket tl"></div><div class="bracket tr"></div>
          <div class="bracket bl"></div><div class="bracket br"></div>
        </div>
        <div class="live-pill" id="livePill"><b></b> EN VIVO</div>
        <div class="overlay" id="overlay"></div>
        <div class="count" id="count"><b>3</b></div>
        <div class="flash" id="flash"></div>
      </div>

      <div class="toolbar">
        <button class="chip active" data-mode="single" type="button">Foto única</button>
        <button class="chip" data-mode="strip" type="button">Tira x4</button>
        <button class="chip active" data-timer="3" type="button">3 s</button>
        <button class="chip" data-timer="5" type="button">5 s</button>
      </div>

      <div class="controls">
        <button class="icon-btn hidden" id="btnFlip" title="Voltear cámara" aria-label="Voltear cámara">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/><path d="M16 16h-4v4"/></svg>
        </button>
        <button class="shutter" id="btnShot" disabled aria-label="Tomar foto"></button>
        <button class="icon-btn" id="btnDl" disabled title="Descargar última" aria-label="Descargar última foto">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
      </div>
      <p class="hint">Espacio toma la foto · Esc cancela la cuenta</p>
    </section>

    <aside class="side">
      <div class="panel">
        <h3>Filtros</h3>
        <div class="filters" id="filters"></div>
      </div>
      <div class="panel">
        <h3>Tips de cabina</h3>
        <p style="color:var(--muted);font-size:13px;line-height:1.5">Mira a la lente, prueba Neón o Vintage y arma una tira de 4 poses. Tus fotos se quedan en este dispositivo.</p>
      </div>
    </aside>
  </div>

  <section class="gallery-wrap">
    <div class="gallery-head">
      <span>Tira de tomas</span>
      <button class="btn ghost" id="btnClear" type="button" style="padding:6px 12px;font-size:12px">Vaciar</button>
    </div>
    <div class="sprockets"></div>
    <div class="film" id="film"><div class="empty">Todavía no hay instantáneas. ¡Enciende la cámara y posa!</div></div>
    <div class="sprockets"></div>
  </section>
</div>

<div class="lightbox" id="box" role="dialog" aria-modal="true">
  <div>
    <img id="boxImg" alt="Foto" />
    <div class="row">
      <button class="btn cyan" id="boxDl" type="button">Descargar</button>
      <button class="btn ghost" id="boxDel" type="button">Borrar</button>
      <button class="btn ghost" id="boxClose" type="button">Cerrar</button>
    </div>
  </div>
</div>

<script>
(function () {
  const FILTERS = [
    { id: 'natural', name: 'Natural', css: 'none' },
    { id: 'bn', name: 'B&N', css: 'grayscale(1) contrast(1.08)' },
    { id: 'sepia', name: 'Sepia', css: 'sepia(.9) contrast(1.08)' },
    { id: 'vintage', name: 'Vintage', css: 'sepia(.4) contrast(1.18) saturate(.8) brightness(1.05)' },
    { id: 'neon', name: 'Neón', css: 'saturate(1.85) contrast(1.22) hue-rotate(318deg)' },
    { id: 'frio', name: 'Frío', css: 'hue-rotate(165deg) saturate(.95) contrast(1.12) brightness(1.05)' },
    { id: 'calido', name: 'Cálido', css: 'sepia(.28) saturate(1.4) brightness(1.08)' },
    { id: 'pop', name: 'Pop', css: 'saturate(1.75) contrast(1.28)' },
    { id: 'noir', name: 'Noir', css: 'grayscale(1) contrast(1.45) brightness(.95)' },
    { id: 'sueno', name: 'Sueño', css: 'blur(1.1px) brightness(1.14) saturate(1.2)' },
    { id: 'candy', name: 'Candy', css: 'hue-rotate(300deg) saturate(1.55) contrast(1.1)' },
    { id: 'cinema', name: 'Cinema', css: 'contrast(1.22) saturate(.82) brightness(.98)' }
  ];

  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const statusEl = document.getElementById('status');
  const livePill = document.getElementById('livePill');
  const btnShot = document.getElementById('btnShot');
  const btnFlip = document.getElementById('btnFlip');
  const btnDl = document.getElementById('btnDl');
  const btnClear = document.getElementById('btnClear');
  const filtersEl = document.getElementById('filters');
  const film = document.getElementById('film');
  const countEl = document.getElementById('count');
  const flashEl = document.getElementById('flash');
  const preview = document.getElementById('preview');
  const box = document.getElementById('box');
  const boxImg = document.getElementById('boxImg');

  let stream = null;
  let facing = 'user';
  let filter = FILTERS[0];
  let mode = 'single';
  let timer = 3;
  let busy = false;
  let shots = [];
  let lastId = null;
  let openId = null;
  let countTimer = 0;

  function setStatus(kind, text) {
    statusEl.className = 'status ' + kind;
    statusEl.querySelector('span').textContent = text;
  }

  function showOverlay(html) {
    overlay.classList.remove('hidden');
    overlay.innerHTML = html;
  }
  function hideOverlay() { overlay.classList.add('hidden'); overlay.innerHTML = ''; }

  function idleCard() {
    showOverlay(
      '<div class="card"><h2>¡Sonríe!</h2><p>Cabina de fotos con vista en vivo, filtros locos y una cuenta regresiva antes del clic.</p><button class="btn" id="btnStart" type="button">Encender cámara</button></div>'
    );
    document.getElementById('btnStart').onclick = startCamera;
    setStatus('wait', 'Cámara apagada');
    livePill.classList.remove('on');
    btnShot.disabled = true;
  }

  FILTERS.forEach(function (f, i) {
    const b = document.createElement('button');
    b.className = 'filter' + (i === 0 ? ' active' : '');
    b.type = 'button';
    b.innerHTML = '<span style="filter:' + f.css + '"></span><em>' + f.name + '</em>';
    b.onclick = function () {
      filter = f;
      video.style.filter = f.css;
      document.querySelectorAll('.filter').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
    };
    filtersEl.appendChild(b);
  });

  document.querySelectorAll('[data-mode]').forEach(function (c) {
    c.onclick = function () {
      mode = c.getAttribute('data-mode');
      document.querySelectorAll('[data-mode]').forEach(function (x) { x.classList.toggle('active', x === c); });
    };
  });
  document.querySelectorAll('[data-timer]').forEach(function (c) {
    c.onclick = function () {
      timer = Number(c.getAttribute('data-timer'));
      document.querySelectorAll('[data-timer]').forEach(function (x) { x.classList.toggle('active', x === c); });
    };
  });

  function beep(freq, dur) {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      g.gain.value = 0.05;
      o.connect(g); g.connect(ac.destination);
      o.start();
      o.stop(ac.currentTime + dur);
      setTimeout(function () { ac.close(); }, (dur + 0.1) * 1000);
    } catch (e) {}
  }

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showOverlay('<div class="card"><h2>Sin cámara</h2><p>Este navegador no permite getUserMedia. Prueba Chrome, Safari o Edge en HTTPS.</p></div>');
      setStatus('bad', 'No disponible');
      return;
    }
    showOverlay('<div class="card"><div class="spin"></div><p>Pidiendo permiso para la cámara…</p></div>');
    setStatus('wait', 'Pidiendo permiso');
    try {
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: facing },
          width: { ideal: 1280 },
          height: { ideal: 960 }
        }
      });
      video.srcObject = stream;
      await video.play();
      video.style.filter = filter.css;
      video.classList.toggle('mirror', facing === 'user');
      hideOverlay();
      livePill.classList.add('on');
      btnShot.disabled = false;
      setStatus('live', facing === 'user' ? 'Cámara frontal' : 'Cámara trasera');
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(function (d) { return d.kind === 'videoinput'; });
      btnFlip.classList.toggle('hidden', cams.length < 2);
    } catch (err) {
      const name = err && err.name;
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
        showOverlay('<div class="card"><h2>Permiso denegado</h2><p>Activa la cámara en la configuración del navegador (candado de la barra de dirección) y reintenta.</p><button class="btn" id="btnRetry" type="button">Reintentar</button></div>');
        setStatus('bad', 'Permiso denegado');
      } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
        showOverlay('<div class="card"><h2>No hay cámara</h2><p>No encontramos un dispositivo de video. Conecta una webcam y reintenta.</p><button class="btn" id="btnRetry" type="button">Reintentar</button></div>');
        setStatus('bad', 'Sin dispositivo');
      } else if (name === 'NotReadableError') {
        showOverlay('<div class="card"><h2>Cámara ocupada</h2><p>Otra app está usando la cámara. Ciérrala y vuelve a intentar.</p><button class="btn" id="btnRetry" type="button">Reintentar</button></div>');
        setStatus('bad', 'Cámara ocupada');
      } else {
        showOverlay('<div class="card"><h2>Algo falló</h2><p>' + (err && err.message ? err.message : 'Error al abrir la cámara') + '</p><button class="btn" id="btnRetry" type="button">Reintentar</button></div>');
        setStatus('bad', 'Error');
      }
      const r = document.getElementById('btnRetry');
      if (r) r.onclick = startCamera;
      btnShot.disabled = true;
      livePill.classList.remove('on');
    }
  }

  btnFlip.onclick = async function () {
    facing = facing === 'user' ? 'environment' : 'user';
    await startCamera();
  };

  function captureFrame() {
    const w = 720, h = 960;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    const vw = video.videoWidth || w;
    const vh = video.videoHeight || h;
    const scale = Math.max(w / vw, h / vh);
    const sw = w / scale, sh = h / scale;
    const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
    ctx.filter = filter.css === 'none' ? 'none' : filter.css;
    if (facing === 'user') { ctx.translate(w, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.filter = 'none';
    ctx.fillStyle = 'rgba(18,8,26,.55)';
    ctx.font = '700 18px Outfit, sans-serif';
    ctx.fillText('FLASHBOOTH · ' + filter.name, 18, h - 22);
    return c.toDataURL('image/jpeg', 0.92);
  }

  function addShot(dataUrl, kind) {
    const item = { id: Date.now() + Math.random(), dataUrl: dataUrl, kind: kind || 'foto', t: new Date() };
    shots.unshift(item);
    lastId = item.id;
    btnDl.disabled = false;
    renderFilm();
    return item;
  }

  function renderFilm() {
    film.innerHTML = '';
    if (!shots.length) {
      film.innerHTML = '<div class="empty">Todavía no hay instantáneas. ¡Enciende la cámara y posa!</div>';
      return;
    }
    shots.forEach(function (s) {
      const el = document.createElement('button');
      el.className = 'shot';
      el.type = 'button';
      el.innerHTML = '<img alt="" /><small>' + (s.kind === 'tira' ? 'TIRA' : 'FOTO') + '</small>';
      el.querySelector('img').src = s.dataUrl;
      el.onclick = function () { openShot(s.id); };
      film.appendChild(el);
    });
  }

  function downloadUrl(url, name) {
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
  }

  btnDl.onclick = function () {
    const s = shots.find(function (x) { return x.id === lastId; }) || shots[0];
    if (s) downloadUrl(s.dataUrl, 'flashbooth-' + Date.now() + '.jpg');
  };

  btnClear.onclick = function () {
    shots = []; lastId = null; btnDl.disabled = true; renderFilm();
  };

  function openShot(id) {
    const s = shots.find(function (x) { return x.id === id; });
    if (!s) return;
    openId = id;
    boxImg.src = s.dataUrl;
    box.classList.add('on');
  }
  document.getElementById('boxClose').onclick = function () { box.classList.remove('on'); };
  document.getElementById('boxDl').onclick = function () {
    const s = shots.find(function (x) { return x.id === openId; });
    if (s) downloadUrl(s.dataUrl, 'flashbooth-' + Date.now() + '.jpg');
  };
  document.getElementById('boxDel').onclick = function () {
    shots = shots.filter(function (x) { return x.id !== openId; });
    box.classList.remove('on');
    if (!shots.length) btnDl.disabled = true;
    renderFilm();
  };
  box.onclick = function (e) { if (e.target === box) box.classList.remove('on'); };

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function countdown() {
    countEl.classList.add('show');
    for (let n = timer; n >= 1; n--) {
      if (!busy) break;
      countEl.querySelector('b').textContent = String(n);
      beep(n === 1 ? 880 : 520, 0.07);
      await wait(1000);
    }
    countEl.classList.remove('show');
  }

  function doFlash() {
    flashEl.classList.remove('go');
    void flashEl.offsetWidth;
    flashEl.classList.add('go');
    beep(180, 0.09);
    if (navigator.vibrate) navigator.vibrate(30);
  }

  function makeStrip(urls) {
    const w = 420, pad = 24, gap = 12, ph = 500, head = 58, foot = 48;
    const c = document.createElement('canvas');
    c.width = w;
    c.height = head + foot + urls.length * ph + (urls.length - 1) * gap + pad * 2;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff6e8';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#ff2d95';
    ctx.fillRect(0, 0, 8, c.height);
    ctx.fillStyle = '#22f0ff';
    ctx.fillRect(c.width - 8, 0, 8, c.height);
    ctx.fillStyle = '#12081a';
    ctx.font = '800 26px Outfit, sans-serif';
    ctx.fillText('FLASHBOOTH', pad + 8, 42);
    const y0 = head + pad / 2;
    return new Promise(function (resolve) {
      let loaded = 0;
      urls.forEach(function (u, i) {
        const img = new Image();
        img.onload = function () {
          const y = y0 + i * (ph + gap);
          ctx.drawImage(img, pad, y, w - pad * 2, ph);
          loaded++;
          if (loaded === urls.length) {
            ctx.fillStyle = '#6b5a78';
            ctx.font = '600 14px Outfit, sans-serif';
            ctx.fillText(new Date().toLocaleString(), pad + 8, c.height - 20);
            resolve(c.toDataURL('image/jpeg', 0.92));
          }
        };
        img.src = u;
      });
    });
  }

  async function shoot() {
    if (busy || !stream || video.readyState < 2) return;
    busy = true;
    btnShot.disabled = true;
    btnFlip.disabled = true;
    setStatus('wait', mode === 'strip' ? 'Tira en curso' : 'Cuenta regresiva');
    try {
      if (mode === 'single') {
        await countdown();
        if (!busy) return;
        doFlash();
        const url = captureFrame();
        addShot(url, 'foto');
        setStatus('live', 'Foto lista');
      } else {
        const frames = [];
        for (let i = 0; i < 4; i++) {
          setStatus('wait', 'Pose ' + (i + 1) + ' de 4');
          await countdown();
          if (!busy) return;
          doFlash();
          const url = captureFrame();
          addShot(url, 'foto');
          frames.push(url);
          if (i < 3) await wait(650);
        }
        const strip = await makeStrip(frames);
        addShot(strip, 'tira');
        downloadUrl(strip, 'flashbooth-tira-' + Date.now() + '.jpg');
        setStatus('live', 'Tira lista');
      }
    } finally {
      busy = false;
      btnShot.disabled = !stream;
      btnFlip.disabled = false;
      if (stream) setStatus('live', facing === 'user' ? 'Cámara frontal' : 'Cámara trasera');
    }
  }

  btnShot.onclick = shoot;
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !e.repeat && e.target === document.body) {
      e.preventDefault();
      shoot();
    }
    if (e.code === 'Escape') {
      busy = false;
      countEl.classList.remove('show');
      box.classList.remove('on');
    }
  });

  idleCard();
})();
</script>
</body>
</html>
